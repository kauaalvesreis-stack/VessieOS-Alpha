/* ---------- Configurações ---------- */
function openSettings(){
  const rec = createWindow({ title:'Configurações', icon:'⚙️', width:560, height:540 });
  rec.body.innerHTML = `
    <div class="set-wrap">
      <div class="set-sec"><h4>Aparência</h4>
        <div class="set-row">
          <span>Tema:</span>
          <button class="abtn th-btn" data-t="dark">🌙 Escuro</button>
          <button class="abtn th-btn" data-t="light">☀️ Claro</button>
        </div>
        <div style="font-size:12px;color:var(--dim)">Papel de parede</div>
        <div class="wp-grid"></div>
      </div>
      <div class="set-sec"><h4>Conta</h4>
        <div class="set-row"><span>Usuário:</span><b>${esc(SETTINGS.currentUser)}</b></div>
        <div class="set-row">
          <input type="password" class="set-input pw-old" placeholder="Senha atual">
          <input type="password" class="set-input pw-new" placeholder="Nova senha">
          <button class="abtn pw-save">Alterar senha</button>
        </div>
      </div>
      <div class="set-sec"><h4>Sistema</h4>
        <div class="set-row">
          <label style="display:flex;align-items:center;gap:9px;cursor:pointer">
            <input type="checkbox" class="switch snd"> Sons do sistema
          </label>
        </div>
        <div class="set-row"><button class="abtn danger reset-sys">⟲ Restaurar sistema (apaga tudo)</button></div>
      </div>
    </div>`;
  const wpGrid = rec.body.querySelector('.wp-grid');
  function renderWp(){
    wpGrid.innerHTML = '';
    WALLPAPERS.forEach((w,i) => {
      const d = document.createElement('div');
      d.className = 'wp-item' + (SETTINGS.wallpaper === i ? ' sel' : '');
      d.style.background = w;
      d.onclick = () => { SETTINGS.wallpaper = i; saveSettings(); applySettings(); renderWp(); beep(600,.05); };
      wpGrid.appendChild(d);
    });
  }
  renderWp();
  rec.body.querySelectorAll('.th-btn').forEach(b => b.onclick = () => {
    SETTINGS.theme = b.dataset.t; saveSettings(); applySettings();
    notify('Configurações','Tema alterado para ' + (SETTINGS.theme === 'dark' ? 'escuro' : 'claro') + '.','🎨');
  });
  const snd = rec.body.querySelector('.snd');
  snd.checked = !!SETTINGS.sounds;
  snd.onchange = () => { SETTINGS.sounds = snd.checked; saveSettings(); if (snd.checked) beep(700,.07); };
  rec.body.querySelector('.pw-save').onclick = () => {
    const oldP = rec.body.querySelector('.pw-old').value;
    const newP = rec.body.querySelector('.pw-new').value;
    const u = SETTINGS.currentUser;
    if (!USERS[u] || USERS[u].pass !== oldP) return notify('Conta','Senha atual incorreta.','⚠️');
    if (newP.length < 3) return notify('Conta','A nova senha precisa ter ao menos 3 caracteres.','⚠️');
    USERS[u].pass = newP; save('vl_users', USERS);
    notify('Conta','Senha alterada com sucesso!','✅'); beep(800,.08);
    rec.body.querySelector('.pw-old').value = '';
    rec.body.querySelector('.pw-new').value = '';
  };
  rec.body.querySelector('.reset-sys').onclick = () => {
    if (!confirm('Restaurar o sistema? Todos os arquivos e configurações serão apagados.')) return;
    ['vl_fs','vl_settings','vl_users','vl_snake_best'].forEach(k => localStorage.removeItem(k));
    location.reload();
  };
}

/* ================================================================
   REGISTRO DE APLICATIVOS
   ================================================================ */
const APPS = {
  files:    { name:'Explorador de Arquivos', icon:'📁', open:() => openFiles('/') },
  editor:   { name:'Editor de Texto',        icon:'📝', open:() => openEditor() },
  terminal: { name:'Terminal',               icon:'▮', open:openTerminal },
  vessie:   { name:'VessieLang Studio',      icon:'⧩', open:() => openVessie() },
  calc:     { name:'Calculadora',            icon:'🧮', open:openCalc },
  paint:    { name:'Paint',                  icon:'🎨', open:openPaint },
  calendar: { name:'Calendário',             icon:'📅', open:openCalendar },
  clock:    { name:'Relógio',                icon:'⏰', open:openClock },
  snake:    { name:'Snake',                  icon:'🐍', open:openSnake },
  tasks:    { name:'Gerenciador de Tarefas', icon:'📊', open:openTasks },
  settings: { name:'Configurações',          icon:'⚙️', open:openSettings },
  about:    { name:'Sobre o Sistema',        icon:'ℹ️', open:() => openAbout(false) }
};
const DESKTOP_APPS = ['files','editor','terminal','vessie','calc','paint','snake','settings'];

/* ================================================================
   DESKTOP / TASKBAR / START MENU / CONTEXTO
   ================================================================ */
function renderDesktopIcons(){
  const c = $('desktopIcons');
  c.innerHTML = '';
  DESKTOP_APPS.forEach(k => {
    const app = APPS[k];
    const d = document.createElement('div');
    d.className = 'dicon';
    d.innerHTML = `<div class="dicon-icon">${app.icon}</div><div class="dicon-label">${app.name}</div>`;
    d.ondblclick = () => app.open();
    c.appendChild(d);
  });
}
function renderStartMenu(filter=''){
  const c = $('startMenuLeft');
  c.innerHTML = '';
  const f = filter.trim().toLowerCase();
  const list = Object.entries(APPS).filter(([,a]) => a.name.toLowerCase().includes(f));
  if (!list.length){
    c.innerHTML = '<div class="sm-empty">Nenhum aplicativo encontrado</div>';
    return;
  }
  list.forEach(([k,a]) => {
    const item = document.createElement('div');
    item.className = 'sm-app';
    item.innerHTML = `<span class="sm-icon">${a.icon}</span><span>${a.name}</span>`;
    item.onclick = () => { a.open(); $('startMenu').classList.remove('open'); };
    c.appendChild(item);
  });
}
 $('startBtn').onclick = () => {
  const sm = $('startMenu');
  const opening = !sm.classList.contains('open');
  sm.classList.toggle('open');
  if (opening){
    $('startMenuSearch').value = '';
    renderStartMenu();
    setTimeout(() => $('startMenuSearch').focus(), 60);
  }
};
 $('startMenuSearch').addEventListener('input', e => renderStartMenu(e.target.value));
 $('startMenuSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    const first = $('startMenuLeft').querySelector('.sm-app');
    if (first) first.click();
  }
});
document.querySelectorAll('.start-power-btn').forEach(b => b.onclick = () => {
  $('startMenu').classList.remove('open');
  if (b.dataset.action === 'logout') logout();
  if (b.dataset.action === 'reboot'){ notify('Sistema','Reiniciando…','⟳'); setTimeout(() => location.reload(), 600); }
  if (b.dataset.action === 'shutdown') shutdown();
});
function tickClock(){
  const n = new Date();
  $('taskbarClock').innerHTML =
    n.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) +
    `<span class="d">${n.toLocaleDateString('pt-BR')}</span>`;
}
 $('taskbarClock').onclick = () => openClock();

/* menu de contexto da área de trabalho */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.window') || e.target.closest('#taskbar') || e.target.closest('#startMenu')) return;
  e.preventDefault();
  const cm = $('ctxMenu');
  cm.innerHTML = `
    <div class="ctx-item" data-a="nf">📄 Novo arquivo em /Documentos</div>
    <div class="ctx-item" data-a="nd">📁 Nova pasta em /Documentos</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-a="term">▮ Abrir Terminal</div>
    <div class="ctx-item" data-a="files">📁 Abrir Explorador</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-a="wall">🎨 Alterar papel de parede</div>
    <div class="ctx-item" data-a="set">⚙️ Configurações</div>`;
  cm.classList.add('open');
  cm.style.left = clamp(e.clientX, 4, innerWidth - 240) + 'px';
  cm.style.top  = clamp(e.clientY, 4, innerHeight - 300) + 'px';
  cm.querySelectorAll('.ctx-item').forEach(item => item.onclick = () => {
    cm.classList.remove('open');
    const a = item.dataset.a;
    if (a === 'term') openTerminal();
    if (a === 'files') openFiles('/');
    if (a === 'set') openSettings();
    if (a === 'wall'){
      SETTINGS.wallpaper = (SETTINGS.wallpaper + 1) % WALLPAPERS.length;
      saveSettings(); applySettings();
      notify('Papel de parede','Alterado com sucesso.','🎨');
    }
    if (a === 'nf'){
      const n = prompt('Nome do novo arquivo:', 'novo.txt');
      if (n && !n.includes('/')){
        writeFile('/Documentos/' + n, '');
        notify('Arquivos', `"${n}" criado em /Documentos.`, '📄');
      }
    }
    if (a === 'nd'){
      const n = prompt('Nome da nova pasta:', 'nova-pasta');
      if (n && !n.includes('/')){
        const par = getParent('/Documentos/' + n);
        if (par && !par[0].children[par[1]]){
          par[0].children[par[1]] = { type:'dir', children:{} }; saveFS();
          notify('Arquivos', `"${n}" criada em /Documentos.`, '📁');
        }
      }
    }
  });
});
document.addEventListener('click', e => {
  if (!e.target.closest('#ctxMenu')) $('ctxMenu').classList.remove('open');
  if (!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) $('startMenu').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ $('ctxMenu').classList.remove('open'); $('startMenu').classList.remove('open'); }
});

/* ================================================================
   LOGIN / BOOT / SESSÃO
   ================================================================ */
function showLoginError(msg){
  $('loginError').textContent = msg;
  const box = $('loginBox');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  beep(180,.15,'square',.05);
}
function attemptLogin(){
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) return showLoginError('Preencha usuário e senha.');
  if (!USERS[u]) return showLoginError(`Usuário "${u}" não existe. (padrão: admin)`);
  if (USERS[u].pass !== p) return showLoginError('Senha incorreta. (padrão: admin)');
  startSession(u);
}
 $('loginBtn').onclick = attemptLogin;
[$('loginUser'), $('loginPass')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); }));

function startSession(user){
  SETTINGS.currentUser = u0(user); saveSettings();
  function u0(x){ return x; }
  beep(660,.09); setTimeout(() => beep(880,.12), 90);
  $('loginScreen').classList.add('fade');
  setTimeout(() => {
    $('loginScreen').style.display = 'none';
    $('bootScreen').style.display = 'flex';
    const log = $('bootLog');
    log.innerHTML = '';
    const lines = [
      ['ves-kernel 2.0.1 — iniciando núcleo…', 'ok'],
      ['montando sistema de arquivos virtual…', 'ok'],
      ['carregando interpretador VessieLang…', 'ok'],
      ['inicializando servidor gráfico…', 'ok'],
      [`sessão de "${user}" iniciada. bem-vindo(a)!`, '']
    ];
    let i = 0;
    (function step(){
      if (i < lines.length){
        const d = document.createElement('div');
        d.innerHTML = esc(lines[i][0]) + (lines[i][1] ? ' <span class="ok">[ ' + lines[i][1] + ' ]</span>' : '');
        log.appendChild(d);
        i++;
        setTimeout(step, 230);
      } else setTimeout(finishBoot, 380);
    })();
  }, 430);
}
function finishBoot(){
  $('bootScreen').style.display = 'none';
  $('desktop').classList.add('ready');
  notify('Bem-vindo!', `Sessão iniciada como ${SETTINGS.currentUser}.`, '👋');
  if (!SETTINGS.firstRunDone){
    SETTINGS.firstRunDone = true; saveSettings();
    setTimeout(() => openAbout(true), 600);
  }
}
function logout(){
  closeAllWindows();
  $('startMenu').classList.remove('open');
  $('desktop').classList.remove('ready');
  const ls = $('loginScreen');
  ls.style.display = 'flex';
  requestAnimationFrame(() => ls.classList.remove('fade'));
  $('loginPass').value = '';
  $('loginError').textContent = '';
}
function shutdown(){
  closeAllWindows();
  $('startMenu').classList.remove('open');
  beep(440,.2,'sine',.05);
  $('desktop').classList.remove('ready');
  setTimeout(() => $('powerScreen').style.display = 'flex', 350);
}
 $('powerOn').onclick = () => location.reload();


/* ================================================================
   INICIALIZAÇÃO
   ================================================================ */
applySettings();
renderDesktopIcons();
renderStartMenu();
tickClock();
setInterval(tickClock, 1000);
</script>
